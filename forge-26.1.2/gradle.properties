org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ForgeGradle 7: classes and resources of the main source set share one output for the dev runs.
net.minecraftforge.gradle.merge-source-sets=true

# Environment
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
forge_version=64.1.3
forge_version_range=[64,)
loader_version_range=[64,)

# Mod
mod_id=lauramod
mod_name=My Girlfriend Laura
mod_license=Apache-2.0
mod_version=2.0.0
mod_group_id=com.vyrriox.lauramod
mod_authors=vyrriox
mod_description=Laura is your companion: she follows you, talks in your language, fetches items, keeps a home, dances, sulks, and can wear any skin or Blockbench model.

# Port of the self test server (one per target, so several can run at the same time).
selftest_port=25632
