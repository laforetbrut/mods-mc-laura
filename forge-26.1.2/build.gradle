plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

// Minecraft 26.1.2 ships Java 25 to players.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Loader-independent code for this Minecraft version lives in ../common on the main branch.
// On the per-target branches it is merged into src/main, so this block does nothing there.
def commonDir = file("../common/${minecraft_version}/src/main")
if (commonDir.isDirectory()) {
    sourceSets.main.java.srcDir(new File(commonDir, 'java'))
    sourceSets.main.resources.srcDir(new File(commonDir, 'resources'))
}

sourceSets.main.resources {
    exclude('**/*.bbmodel.license')
}

// Minecraft 26.1 ships without obfuscation, so no mappings channel is needed.
minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        // Forge only ships client, server, data and gameTestServer launch configs. The two runs below
        // have other names, so they repeat the launch settings of the Forge userdev metadata.

        // Client that opens every screen of the mod in the quick play world laura_test and saves screenshots.
        register('clienttest') {
            workingDir = layout.projectDirectory.dir('run-clienttest')
            mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
            args '--gameDir', '.', '--launchTarget', 'forge_userdev_client', '--version', 'MOD_DEV',
                    '--assetIndex', '{asset_index}', '--assetsDir', '{assets_root}',
                    '--quickPlaySingleplayer', 'laura_test'
            jvmArgs '-Djava.net.preferIPv6Addresses=system', '-XX:+UseCompactObjectHeaders'
            environment 'MCP_MAPPINGS', '{mcp_mappings}'
            systemProperty 'lauramod.clienttest', 'true'
        }

        // Dedicated server that runs the mod's self tests, writes lauramod-selftest.json and stops.
        register('selftest') {
            workingDir = layout.projectDirectory.dir('run-selftest')
            mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
            args '--gameDir', '.', '--launchTarget', 'forge_userdev_server', '--nogui'
            jvmArgs '-Djava.net.preferIPv6Addresses=system', '-XX:+UseCompactObjectHeaders'
            environment 'MCP_MAPPINGS', '{mcp_mappings}'
            systemProperty 'lauramod.selftest', 'true'
            // -PselftestOnly=name runs only the tests whose name contains it.
            if (project.hasProperty('selftestOnly')) {
                systemProperty 'lauramod.selftest.only', project.property('selftestOnly')
            }
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

// The license file sits at the repository root on main and at the project root on a target branch.
def licenseFile = commonDir.isDirectory() ? file('../LICENSE') : file('LICENSE')
def licenseName = "LICENSE_${mod_id}"
tasks.named('jar', Jar).configure {
    from(licenseFile) {
        rename { licenseName }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}

// The self test server runs in run-selftest, which is not in git: this task writes what it needs.
// A Minecraft server only starts once its EULA (https://aka.ms/MinecraftEULA) is accepted: pass
// -PacceptEula, or create run-selftest/eula.txt with eula=true yourself.
tasks.register('prepareSelftest') {
    def dir = layout.projectDirectory.dir('run-selftest').asFile
    def port = providers.gradleProperty('selftest_port').get()
    def acceptEula = providers.gradleProperty('acceptEula').isPresent()
    doLast {
        dir.mkdirs()
        def eula = new File(dir, 'eula.txt')
        if (acceptEula) {
            eula.text = 'eula=true\n'
        } else if (!eula.isFile() || !eula.text.contains('eula=true')) {
            throw new GradleException('The self test starts a Minecraft server. Read https://aka.ms/MinecraftEULA, then run again with -PacceptEula (or create run-selftest/eula.txt with eula=true).')
        }
        def properties = new File(dir, 'server.properties')
        if (!properties.isFile()) {
            properties.text = ['online-mode=false', 'level-type=minecraft\\:flat', 'spawn-protection=0', 'max-tick-time=-1',
                               "server-port=${port}", "query.port=${port}"].join('\n') + '\n'
        }
    }
}
tasks.matching { it.name == 'runSelftest' }.configureEach { dependsOn 'prepareSelftest' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
