org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
# NeoForge for Minecraft 1.20.1 is the 47.1 fork of Forge: it loads as the mod "forge".
neo_version=47.1.106
neo_version_range=[47.1,)
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Optional integrations (compile only)
ae2_version=15.4.10
curios_version=5.14.1+1.20.1
farmers_delight_version=1.20.1-1.3.4
kubejs_version=2001.6.5-build.26
rhino_version=2001.2.2-build.17
architectury_version=9.1.12

# Mod
mod_id=lauramod
mod_name=My Girlfriend Laura
mod_license=Apache-2.0
mod_version=2.0.0
mod_group_id=com.vyrriox.lauramod
mod_authors=vyrriox
mod_description=Laura is your companion: she follows you, talks in your language, fetches items, keeps a home, dances, sulks, and can wear any skin or Blockbench model.

# Port of the self test server (one per target, so several can run at the same time).
selftest_port=25623
