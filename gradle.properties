org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment
minecraft_version=1.21.1
minecraft_version_range=~1.21.1
# https://fabricmc.net/develop/
loader_version=0.19.5
fabric_api_version=0.116.17+1.21.1

# Optional integrations (compile only). AE2, Curios and KubeJS have no Fabric 1.21.1 release.
farmers_delight_version=1.21.1-3.3.6

# Mod
mod_id=lauramod
mod_name=My Girlfriend Laura
mod_license=MIT
mod_version=2.0.0
mod_group_id=com.vyrriox.lauramod
mod_authors=vyrriox
mod_description=Laura is your companion: she follows you, talks in your language, fetches items, keeps a home, dances, sulks, and can wear any skin or Blockbench model.

# Port of the self test server (one per target, so several can run at the same time).
selftest_port=25613
