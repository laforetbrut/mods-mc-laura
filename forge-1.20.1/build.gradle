plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

// Minecraft 1.20.1 ships Java 17 to players.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Loader-independent code for this Minecraft version lives in ../common on the main branch.
// On the per-target branches it is merged into src/main, so this block does nothing there.
def commonDir = file("../common/${minecraft_version}/src/main")
if (commonDir.isDirectory()) {
    sourceSets.main.java.srcDir(new File(commonDir, 'java'))
    sourceSets.main.resources.srcDir(new File(commonDir, 'resources'))
}

sourceSets.main.resources {
    exclude('**/*.bbmodel.license')
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${minecraft_version}"

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            if (project.hasProperty('withCompatMods')) {
                // The mixins of the test mods are written against SRG names.
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            }
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        // Client that opens every screen of the mod in the quick play world laura_test and saves screenshots.
        clienttest {
            workingDirectory project.file('run-clienttest')
            args '--quickPlaySingleplayer', 'laura_test'
            property 'lauramod.clienttest', 'true'
        }

        // Dedicated server that runs the mod's self tests, writes lauramod-selftest.json and stops.
        // It extends the server run (see below), so it starts with --nogui too.
        selftest {
            workingDirectory project.file('run-selftest')
            property 'lauramod.selftest', 'true'
            // -PselftestOnly=name runs only the tests whose name contains it.
            if (project.hasProperty('selftestOnly')) {
                property 'lauramod.selftest.only', project.property('selftestOnly')
            }
            if (project.hasProperty('withCompatMods')) {
                // A world remembers the registries of the mods it was created with: one world per mod set.
                args '--world', 'world-compat'
            }
        }
    }
}

// Forge only ships launch settings for its own run names (client, server...), and ForgeGradle
// resolves the parents of a run in name order without following the parents of a parent, so
// "selftest" cannot simply declare "server" as its parent. The two test runs take the settings of
// the run they extend (arguments included) once ForgeGradle has completed it.
afterEvaluate {
    minecraft.runs.clienttest.merge(minecraft.runs.client, false)
    minecraft.runs.selftest.merge(minecraft.runs.server, false)
}

repositories {
    maven {
        name = 'ModMaven (Applied Energistics 2 API)'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'Modrinth (compat test mods)'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Latvian (KubeJS)'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        name = 'Architectury (KubeJS dependency)'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Illusive Soulworks (Curios API)'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional integrations: compiled against their public APIs, never bundled in the jar.
    // fg.deobf remaps them from SRG names to the development mappings.
    compileOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}:api")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    compileOnly(fg.deobf("maven.modrinth:farmers-delight:${farmers_delight_version}")) {
        transitive = false
    }
    compileOnly(fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")) {
        transitive = false
    }
    compileOnly(fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")) {
        transitive = false
    }
    // Mods loaded only in dev runs started with -PwithCompatMods, to test the integrations for real.
    if (project.hasProperty('withCompatMods')) {
        runtimeOnly(fg.deobf("maven.modrinth:farmers-delight:${farmers_delight_version}")) {
            transitive = false
        }
        runtimeOnly(fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")) {
            transitive = false
        }
        runtimeOnly(fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")) {
            transitive = false
        }
        runtimeOnly(fg.deobf("dev.architectury:architectury-forge:${architectury_version}")) {
            transitive = false
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

// The license file sits at the repository root on main and at the project root on a target branch.
def licenseFile = commonDir.isDirectory() ? file('../LICENSE') : file('LICENSE')
def licenseName = "LICENSE_${mod_id}"
tasks.named('jar', Jar).configure {
    from(licenseFile) {
        rename { licenseName }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors
        ])
    }
    // Forge 1.20.1 runs on SRG names outside of development: the jar is remapped after it is built.
    finalizedBy 'reobfJar'
}

// The self test server runs in run-selftest, which is not in git: this task writes what it needs.
// A Minecraft server only starts once its EULA (https://aka.ms/MinecraftEULA) is accepted: pass
// -PacceptEula, or create run-selftest/eula.txt with eula=true yourself.
tasks.register('prepareSelftest') {
    def dir = layout.projectDirectory.dir('run-selftest').asFile
    def port = providers.gradleProperty('selftest_port').get()
    def acceptEula = providers.gradleProperty('acceptEula').isPresent()
    // Scripts of the optional mods loaded with -PwithCompatMods (the KubeJS test script).
    def fixtures = layout.projectDirectory.dir('src/selftest').asFile
    def withCompatMods = providers.gradleProperty('withCompatMods').isPresent()
    doLast {
        dir.mkdirs()
        def eula = new File(dir, 'eula.txt')
        if (acceptEula) {
            eula.text = 'eula=true\n'
        } else if (!eula.isFile() || !eula.text.contains('eula=true')) {
            throw new GradleException('The self test starts a Minecraft server. Read https://aka.ms/MinecraftEULA, then run again with -PacceptEula (or create run-selftest/eula.txt with eula=true).')
        }
        def properties = new File(dir, 'server.properties')
        if (!properties.isFile()) {
            properties.text = ['online-mode=false', 'level-type=minecraft\\:flat', 'spawn-protection=0', 'max-tick-time=-1',
                               "server-port=${port}", "query.port=${port}"].join('\n') + '\n'
        }
        if (withCompatMods && fixtures.isDirectory()) {
            fixtures.eachFileRecurse(groovy.io.FileType.FILES) { source ->
                def target = new File(dir, fixtures.toPath().relativize(source.toPath()).toString())
                target.parentFile.mkdirs()
                target.bytes = source.bytes
            }
        }
    }
}
tasks.matching { it.name == 'runSelftest' }.configureEach { dependsOn 'prepareSelftest' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
