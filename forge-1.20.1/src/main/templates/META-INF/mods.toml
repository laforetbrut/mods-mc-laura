modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/laforetbrut/mods-mc-laura/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/laforetbrut/mods-mc-laura"
logoFile="lauramod_logo.png"
authors="${mod_authors}"
credits="Created by vyrriox"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The interface kit, a separate mod. Servers do not need it: every minuit call is client side.
[[dependencies.${mod_id}]]
    modId="minuit"
    mandatory=true
    versionRange="[2.0,3.0)"
    ordering="NONE"
    side="CLIENT"
