name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Interface and dialogue files of the 18 languages must stay complete. Only on main: the target
  # branches do not carry the tools folder.
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check languages
        run: |
          if [ ! -f tools/check_lang.py ]; then echo "No tools folder on this branch."; exit 0; fi
          for dir in common/*/; do
            version=$(basename "$dir")
            echo "== Minecraft $version"
            python3 tools/check_lang.py --mc "$version"
          done

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: neoforge-1.20.1
            java: 17
          - project: forge-1.20.1
            java: 17
          - project: fabric-1.20.1
            java: 17
          - project: neoforge-1.21.1
            java: 21
          - project: forge-1.21.1
            java: 21
          - project: fabric-1.21.1
            java: 21
          - project: neoforge-26.1.2
            java: 25
          - project: forge-26.1.2
            java: 25
          - project: fabric-26.1.2
            java: 25
    steps:
      - uses: actions/checkout@v4
      # On main every target is a folder; on a target branch the project sits at the root.
      - name: Locate project
        id: dir
        run: |
          if [ -d "${{ matrix.project }}" ]; then echo "path=${{ matrix.project }}" >> "$GITHUB_OUTPUT";
          elif [ "${GITHUB_REF_NAME}" = "${{ matrix.project }}" ]; then echo "path=." >> "$GITHUB_OUTPUT";
          else echo "path=" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.dir.outputs.path != ''
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        if: steps.dir.outputs.path != ''
      - name: Build
        if: steps.dir.outputs.path != ''
        working-directory: ${{ steps.dir.outputs.path }}
        run: chmod +x gradlew && ./gradlew build --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: steps.dir.outputs.path != ''
        with:
          name: lauramod-${{ matrix.project }}
          path: ${{ steps.dir.outputs.path }}/build/libs/*.jar
