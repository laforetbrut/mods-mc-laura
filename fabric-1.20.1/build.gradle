// Only used to read the jars nested in a compat test mod (see unpackNestedJars): resolving it with
// the project repositories while the build is configured would lock the repositories Loom sets up.
buildscript {
    repositories {
        maven {
            name = 'Modrinth (compat test mods)'
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }
    }
}

plugins {
    id 'fabric-loom' version '1.17.21'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

// Minecraft 1.20.1 ships Java 17 to players.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Loader-independent code for this Minecraft version lives in ../common on the main branch.
// On the per-target branches it is merged into src/main, so this block does nothing there.
def commonDir = file("../common/${minecraft_version}/src/main")
if (commonDir.isDirectory()) {
    sourceSets.main.java.srcDir(new File(commonDir, 'java'))
    sourceSets.main.resources.srcDir(new File(commonDir, 'resources'))
}

sourceSets.main.resources {
    exclude('**/*.bbmodel.license')
}

repositories {
    maven {
        name = 'ModMaven (Applied Energistics 2 API)'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'Modrinth (compat mods)'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Latvian (KubeJS)'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        name = 'Architectury (KubeJS dependency)'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // The common code is written with the official Mojang names.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Optional integrations: compiled against their public APIs, never bundled in the jar.
    modCompileOnly("appeng:appliedenergistics2-fabric:${ae2_version}:api") {
        transitive = false
    }
    modCompileOnly("maven.modrinth:farmers-delight-refabricated:${farmers_delight_version}") {
        transitive = false
    }
    modCompileOnly("dev.latvian.mods:kubejs-fabric:${kubejs_version}") {
        transitive = false
    }
    modCompileOnly("dev.latvian.mods:rhino-fabric:${rhino_version}") {
        transitive = false
    }
    // Mods loaded only in dev runs started with -PwithCompatMods, to test the integrations for real.
    if (project.hasProperty('withCompatMods')) {
        modLocalRuntime("maven.modrinth:farmers-delight-refabricated:${farmers_delight_version}") {
            transitive = false
        }
        // Farmer's Delight Refabricated for 1.20.1 carries Porting Lib and Fabric ASM inside its jar.
        // Loom drops the jars nested in a development mod, so they are unpacked and loaded one by one.
        modLocalRuntime files(unpackNestedJars("maven.modrinth:farmers-delight-refabricated:${farmers_delight_version}"))
        modLocalRuntime("dev.latvian.mods:kubejs-fabric:${kubejs_version}") {
            transitive = false
        }
        modLocalRuntime("dev.latvian.mods:rhino-fabric:${rhino_version}") {
            transitive = false
        }
        modLocalRuntime("dev.architectury:architectury-fabric:${architectury_version}") {
            transitive = false
        }
    }
}

/**
 * The jars nested in a mod (META-INF/jars, at any depth), unpacked under build/nested-jars. A mod
 * nested twice under two file names is kept once, like Fabric Loader does in production.
 */
List<File> unpackNestedJars(String notation) {
    def mod = buildscript.configurations.detachedConfiguration(buildscript.dependencies.create(notation))
    mod.transitive = false
    def outDir = layout.buildDirectory.dir("nested-jars/${notation.replace(':', '_')}").get().asFile
    outDir.mkdirs()
    List<File> out = []
    Set<String> seen = []
    def unpack
    unpack = { File jar ->
        new java.util.zip.ZipFile(jar).withCloseable { zip ->
            zip.entries().toList().findAll { !it.directory && it.name.startsWith('META-INF/jars/') && it.name.endsWith('.jar') }.each { entry ->
                def target = new File(outDir, entry.name.substring(entry.name.lastIndexOf('/') + 1))
                if (!target.isFile() || target.length() != entry.size) {
                    target.withOutputStream { stream -> zip.getInputStream(entry).withCloseable { it.transferTo(stream) } }
                }
                // Mods are told apart by their id, plain libraries by their file name.
                def key = new java.util.zip.ZipFile(target).withCloseable { nested ->
                    def metadata = nested.getEntry('fabric.mod.json')
                    metadata == null ? target.name : new groovy.json.JsonSlurper().parse(nested.getInputStream(metadata)).id
                }
                if (seen.add(key)) {
                    out << target
                    unpack(target)
                }
            }
        }
    }
    unpack(mod.singleFile)
    return out
}

loom {
    // KubeJS adds interfaces to Minecraft classes. They must not show up when compiling against it,
    // or code that only works with KubeJS installed would compile.
    interfaceInjection {
        enableDependencyInterfaceInjection = false
    }
    runs {
        client {
            client()
            runDir 'run'
        }
        server {
            server()
            runDir 'run-server'
            programArg 'nogui'
        }
        // Client that opens every screen of the mod in the quick play world laura_test and saves screenshots.
        clienttest {
            client()
            configName = 'Laura Client Test'
            runDir 'run-clienttest'
            programArgs '--quickPlaySingleplayer', 'laura_test'
            vmArg '-Dlauramod.clienttest=true'
        }
        // Dedicated server that runs the mod's self tests, writes lauramod-selftest.json and stops.
        selftest {
            server()
            configName = 'Laura Self Test'
            runDir 'run-selftest'
            vmArg '-Dlauramod.selftest=true'
            // -PselftestOnly=name runs only the tests whose name contains it.
            if (project.hasProperty('selftestOnly')) {
                vmArg "-Dlauramod.selftest.only=${project.property('selftestOnly')}"
            }
            programArg 'nogui'
            if (project.hasProperty('withCompatMods')) {
                // A world remembers the registries of the mods it was created with: one world per mod set.
                programArgs '--world', 'world-compat'
            }
        }
    }
}

processResources {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            loader_version         : loader_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs << '-Xlint:deprecation'
}

// The license file sits at the repository root on main and at the project root on a target branch.
def licenseFile = commonDir.isDirectory() ? file('../LICENSE') : file('LICENSE')
def licenseName = "LICENSE_${mod_id}"
if (!licenseFile.isFile()) {
    logger.warn("No license file at ${licenseFile}: the jar will not contain ${licenseName}")
}
tasks.named('jar', Jar).configure {
    from(licenseFile) {
        rename { licenseName }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}

// The self test server runs in run-selftest, which is not in git: this task writes what it needs.
// A Minecraft server only starts once its EULA (https://aka.ms/MinecraftEULA) is accepted: pass
// -PacceptEula, or create run-selftest/eula.txt with eula=true yourself.
tasks.register('prepareSelftest') {
    def dir = layout.projectDirectory.dir('run-selftest').asFile
    def port = providers.gradleProperty('selftest_port').get()
    def acceptEula = providers.gradleProperty('acceptEula').isPresent()
    // Scripts of the optional mods loaded with -PwithCompatMods (the KubeJS test script).
    def fixtures = layout.projectDirectory.dir('src/selftest').asFile
    def withCompatMods = providers.gradleProperty('withCompatMods').isPresent()
    doLast {
        dir.mkdirs()
        def eula = new File(dir, 'eula.txt')
        if (acceptEula) {
            eula.text = 'eula=true\n'
        } else if (!eula.isFile() || !eula.text.contains('eula=true')) {
            throw new GradleException('The self test starts a Minecraft server. Read https://aka.ms/MinecraftEULA, then run again with -PacceptEula (or create run-selftest/eula.txt with eula=true).')
        }
        def properties = new File(dir, 'server.properties')
        if (!properties.isFile()) {
            properties.text = ['online-mode=false', 'level-type=minecraft\\:flat', 'spawn-protection=0', 'max-tick-time=-1',
                               "server-port=${port}", "query.port=${port}"].join('\n') + '\n'
        }
        if (withCompatMods && fixtures.isDirectory()) {
            fixtures.eachFileRecurse(groovy.io.FileType.FILES) { source ->
                def target = new File(dir, fixtures.toPath().relativize(source.toPath()).toString())
                target.parentFile.mkdirs()
                target.bytes = source.bytes
            }
        }
    }
}
tasks.matching { it.name == 'runSelftest' }.configureEach { dependsOn 'prepareSelftest' }
