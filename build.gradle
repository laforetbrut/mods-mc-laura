plugins {
    id 'fabric-loom' version '1.17.21'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

// Minecraft 1.21.1 ships Java 21 to players.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Loader-independent code for this Minecraft version lives in ../common on the main branch.
// On the per-target branches it is merged into src/main, so this block does nothing there.
def commonDir = file("../common/${minecraft_version}/src/main")
if (commonDir.isDirectory()) {
    sourceSets.main.java.srcDir(new File(commonDir, 'java'))
    sourceSets.main.resources.srcDir(new File(commonDir, 'resources'))
}

sourceSets.main.resources {
    exclude('**/*.bbmodel.license')
}

repositories {
    maven {
        name = 'Modrinth (compat mods)'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // The common code is written with the official Mojang names.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Optional integration: compiled against Farmer's Delight Refabricated, never bundled in the jar.
    modCompileOnly "maven.modrinth:farmers-delight-refabricated:${farmers_delight_version}"
    // Loaded only in dev runs started with -PwithCompatMods, to test the integration for real.
    if (project.hasProperty('withCompatMods')) {
        modLocalRuntime "maven.modrinth:farmers-delight-refabricated:${farmers_delight_version}"
    }
}

loom {
    runs {
        client {
            client()
            runDir 'run'
        }
        server {
            server()
            runDir 'run-server'
            programArg 'nogui'
        }
        // Client that opens every screen of the mod in the quick play world laura_test and saves screenshots.
        clienttest {
            client()
            configName = 'Laura Client Test'
            runDir 'run-clienttest'
            vmArg '-Dlauramod.clienttest=true'
            programArgs '--quickPlaySingleplayer', 'laura_test'
        }
        // Dedicated server that runs the mod's self tests, writes lauramod-selftest.json and stops.
        selftest {
            server()
            configName = 'Laura Self Test'
            runDir 'run-selftest'
            vmArg '-Dlauramod.selftest=true'
            // -PselftestOnly=name runs only the tests whose name contains it.
            if (project.hasProperty('selftestOnly')) {
                vmArg "-Dlauramod.selftest.only=${project.property('selftestOnly')}"
            }
            programArg 'nogui'
        }
    }
}

processResources {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            loader_version         : loader_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:deprecation'
}

// The license file sits at the repository root on main and at the project root on a target branch.
def licenseFile = commonDir.isDirectory() ? file('../LICENSE') : file('LICENSE')
def licenseName = "LICENSE_${mod_id}"
if (!licenseFile.isFile()) {
    logger.warn("No license file at ${licenseFile}: the jar will not contain ${licenseName}")
}
tasks.named('jar', Jar).configure {
    from(licenseFile) {
        rename { licenseName }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}

// The self test server runs in run-selftest, which is not in git: this task writes what it needs.
// A Minecraft server only starts once its EULA (https://aka.ms/MinecraftEULA) is accepted: pass
// -PacceptEula, or create run-selftest/eula.txt with eula=true yourself.
tasks.register('prepareSelftest') {
    def dir = layout.projectDirectory.dir('run-selftest').asFile
    def port = providers.gradleProperty('selftest_port').get()
    def acceptEula = providers.gradleProperty('acceptEula').isPresent()
    doLast {
        dir.mkdirs()
        def eula = new File(dir, 'eula.txt')
        if (acceptEula) {
            eula.text = 'eula=true\n'
        } else if (!eula.isFile() || !eula.text.contains('eula=true')) {
            throw new GradleException('The self test starts a Minecraft server. Read https://aka.ms/MinecraftEULA, then run again with -PacceptEula (or create run-selftest/eula.txt with eula=true).')
        }
        def properties = new File(dir, 'server.properties')
        if (!properties.isFile()) {
            properties.text = ['online-mode=false', 'level-type=minecraft\\:flat', 'spawn-protection=0', 'max-tick-time=-1',
                               "server-port=${port}", "query.port=${port}"].join('\n') + '\n'
        }
    }
}
tasks.matching { it.name == 'runSelftest' }.configureEach { dependsOn 'prepareSelftest' }
